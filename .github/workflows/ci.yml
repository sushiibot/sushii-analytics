name: CI

on:
  push:
  pull_request:
    branches:
      - main

env:
  image: ghcr.io/sushiibot/sushii-analytics

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  docker-build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: sushiibot/sushii-workflows/.github/workflows/build-verified.yml@5584ab068ab9adf7918fac6263df307cdafbf106
    with:
      image_name: ghcr.io/sushiibot/sushii-analytics

  deploy:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      statuses: write
      packages: read
      id-token: write
      attestations: write
    uses: sushiibot/sushii-workflows/.github/workflows/release-auto.yml@5584ab068ab9adf7918fac6263df307cdafbf106
    with:
      target: production
      image_name: ghcr.io/sushiibot/sushii-analytics
      artifact_digest: ${{ needs.docker-build.outputs.artifact_digest }}
      environment: production
      require_approval: true
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}
